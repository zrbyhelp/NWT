services:
  mysql:
    image: mysql:8.4
    container_name: nwt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nwt
      MYSQL_USER: nwt
      MYSQL_PASSWORD: nwt_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: nwt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nwt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: nwt-neo4j
    environment:
      NEO4J_AUTH: neo4j/nwt_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  neo4j-data:
  neo4j-logs:

